name: Idea or change / Idea o modifica
description: Something the addon could do, or a change to the code you would like to make. / Qualcosa che l'addon potrebbe fare, o una modifica al codice che vorresti fare.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Code changes start here: describe the change before writing it, so nobody writes something
        that cannot go in. Some ideas are declined because they do not fit the project's
        [principles](https://github.com/Dade9854/wow-forever-italian/blob/main/docs/architecture/principles.md)
        (for example anything that hides English names, adds a dependency, or puts stored English text in the
        addon). For a wrong or awkward translation, use the translation report. This issue is public. English or
        Italian, either is fine.

        Grazie. Le modifiche al codice cominciano qui: descrivi la modifica prima di scriverla. Alcune idee
        vengono rifiutate perché non rispettano i
        [principi](https://github.com/Dade9854/wow-forever-italian/blob/main/docs/architecture/principles.md) del
        progetto (per esempio nascondere i nomi inglesi, aggiungere dipendenze, salvare testo inglese nell'addon).
        Per una traduzione sbagliata usa la segnalazione di traduzione. Questa issue è pubblica. Va bene scrivere
        in inglese o in italiano.
  - type: textarea
    id: what
    attributes:
      label: What and why / Cosa e perché
      description: What should change, and what it would make better. / Cosa dovrebbe cambiare, e cosa migliorerebbe.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How (optional) / Come (facoltativo)
      description: If you plan to write it yourself, the parts of the code you would change. / Se pensi di scriverla tu, le parti del codice che cambieresti.
    validations:
      required: false
