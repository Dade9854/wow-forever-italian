name: Bug report / Segnalazione di un bug
description: Something in the addon doesn't work. For a wrong or awkward translation, use the translation report instead. / Qualcosa nell'addon non funziona. Per una traduzione sbagliata o poco naturale usa la segnalazione di traduzione.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. The fastest way here is from the game: `/wfi bug` (or Report a bug or idea in the minimap
        button's menu) opens this form with the build, the version and the addon's own Lua errors filled in. For a
        wrong or awkward translation, the translation report is faster: the minimap button (or `/wfi fix`) fills
        it in for you. This issue is public. English or Italian, either is fine.

        Grazie. Il modo più veloce è dal gioco: `/wfi bug` (o "Segnala bug o idea" nel menu del pulsante della
        minimappa) apre questo modulo con build, versione ed errori Lua dell'addon già compilati. Per una traduzione
        sbagliata o poco naturale è più rapida la segnalazione di traduzione: il pulsante della minimappa (o
        `/wfi fix`) la compila per te. Questa issue è pubblica. Va bene scrivere in inglese o in italiano.
  - type: textarea
    id: what
    attributes:
      label: What happened / Cosa è successo
      description: What you did, what you expected, and what you saw instead. A screenshot helps. / Cosa hai fatto, cosa ti aspettavi e cosa hai visto invece. Uno screenshot aiuta.
    validations:
      required: true
  - type: input
    id: client-build
    attributes:
      label: Client build / Build del client
      description: Shown on the login screen, bottom left (for example 1.60.1.70009). / Si vede nella schermata di accesso, in basso a sinistra (per esempio 1.60.1.70009).
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Addon version / Versione dell'addon
      description: "`/wfi version` in game. / `/wfi version` nel gioco."
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Lua errors / Errori Lua (if any / se ci sono)
      description: "`/wfi bug` fills in the addon's own Lua errors, or shows them to paste here. Paste any other Lua error the game showed. / `/wfi bug` compila gli errori Lua dell'addon, o li mostra da incollare qui. Incolla anche ogni altro errore Lua mostrato dal gioco."
      render: text
    validations:
      required: false
