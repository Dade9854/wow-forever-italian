name: Send collected English / Invio dell'inglese raccolto
description: Send the English text your game recorded, so it can be translated. / Invia il testo inglese registrato dal gioco, perché possa essere tradotto.
title: "Collected English"
labels: ["collector-send"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Open this form from the game: on the **English Collector** settings page click **Send English**
        (or type `/wfi collector send`), then follow the steps in the window. The box below is filled in by the link,
        or you paste the text from the window into it. When the window says the text is too long to paste, zip
        **WoWForeverItalian.lua** from `World of Warcraft\<client folder>\WTF\Account\<ACCOUNT>\SavedVariables\`
        and drag it into the box instead. After you submit, click **I sent it** in the game. A check reads the box
        within a minute and comments here.

        **What it contains:** the English game text the addon recorded: quest text, NPC dialogue with the ids of
        the NPCs who said it, item and spell descriptions, and NPC names, keyed by game id, with the game build
        and the addon version. It saves your class and race, because some game lines change depending on
        them. It holds **no character name, account, realm, location, chat
        or time data.** Wording that depends on your character's gender ("sir" / "madam") is kept as your game
        shows it. A zipped saved file also holds the addon's settings and its problem log (`WFI_Log`: times, Lua memory, and the names of game
        functions and frames that failed). This issue is public.

        Grazie. Apri questo modulo dal gioco: nella pagina **Raccolta testi inglesi** delle impostazioni clicca
        **Invia l'inglese** (o scrivi `/wfi collector send`) e segui i passi nella finestra. Il riquadro qui sotto
        si compila dal link, oppure ci incolli il testo della finestra. Se la finestra dice che è troppo lungo,
        comprimi in zip **WoWForeverItalian.lua** da
        `World of Warcraft\<cartella del client>\WTF\Account\<ACCOUNT>\SavedVariables\` e trascinalo nel riquadro.
        Dopo l'invio clicca **Inviato** nel gioco. Un controllo automatico legge il riquadro entro un minuto.

        **Cosa contiene:** il testo inglese del gioco registrato dall'addon (testi delle quest, dialoghi con l'id
        dell'NPC, descrizioni di oggetti e spell, nomi degli NPC), con la build e la versione dell'addon. Salva
        classe e razza, perché alcune frasi del gioco cambiano in base a loro. **Non contiene nome del
        personaggio, account, reame, posizione, chat né orari.** Un file zip salvato contiene anche le
        impostazioni dell'addon e il suo registro dei problemi (`WFI_Log`). Questa issue è pubblica.

  - type: textarea
    id: dump
    attributes:
      label: Collected English
      description: Filled in by the link, or the text from the game's window (it starts with `WFIC1:`), or the zipped file. / Compilato dal link, oppure il testo della finestra del gioco (comincia con `WFIC1:`), oppure il file zip.
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Anything you want to add (optional). / Qualcosa da aggiungere (facoltativo).
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: It contains only what is described above, and I am fine with it being public in this issue. / Contiene solo quanto descritto sopra e mi va bene che sia pubblico in questa issue.
          required: true
