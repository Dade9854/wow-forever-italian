name: Translation report / Segnalazione di traduzione
description: Paste the report from the game (minimap button → Send report) to fix wrong or awkward Italian. / Incolla la segnalazione dal gioco (pulsante della minimappa → Invia segnalazione) per correggere un italiano sbagliato o poco naturale.
title: "Translation report"
labels: ["translation-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. In the game, open the report window (the minimap button, or `/wfi fix`), go to
        **Send report**, click the report, press **Ctrl+C**, and paste below. Paste it as it is: a check reads it within a minute
        and comments here if anything is missing. This issue is public, and so is the credit name you give below: if
        your Italian ships, that name is listed in `ATTRIBUTION.md`.

        Grazie dell'aiuto. Nel gioco apri la finestra delle segnalazioni (il pulsante della minimappa, o
        `/wfi fix`), vai su **Invia segnalazione**, clicca la segnalazione, premi **Ctrl+C** e incollala qui sotto
        così com'è. Un controllo automatico la legge entro un minuto e commenta se manca qualcosa. Questa issue è
        pubblica, e lo è anche il nome per i crediti: se la tua versione viene usata, compare in `ATTRIBUTION.md`.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The whole block, from `WFI-REPORT 1` to `end`. / Tutto il blocco, da `WFI-REPORT 1` a `end`.
      render: text
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit me as
      description: The name to thank in the public credits if your Italian ships. Leave it empty to use your GitHub name. / Il nome da ringraziare nei crediti pubblici se la tua versione viene usata. Lascialo vuoto per usare il nome GitHub.
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: Italian I wrote in this report may ship in the addon under the project's license (GPL-2.0-or-later). / L'italiano che ho scritto in questa segnalazione può essere incluso nell'addon con la licenza del progetto (GPL-2.0-or-later).
          required: true
